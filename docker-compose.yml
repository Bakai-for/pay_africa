version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: payafrica-marketplace-db
    environment:
      POSTGRES_DB: payafrica_market
      POSTGRES_USER: payafrica
      POSTGRES_PASSWORD: payafrica123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payafrica -d payafrica_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: payafrica-marketplace-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payafrica_market
      SPRING_DATASOURCE_USERNAME: payafrica
      SPRING_DATASOURCE_PASSWORD: payafrica123
      JWT_SECRET: payafrica-marketplace-super-secret-32chars-minimum-for-prod-2026!
      MOCK_PAYMENTS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build: ./frontend
    container_name: payafrica-marketplace-web
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    container_name: payafrica-marketplace-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  pgdata:
    driver: local
